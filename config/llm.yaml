llm:
  # Keep this false until API keys are configured in your shell environment.
  enabled: false

  # Default profile used when a task does not specify its own route.
  active_profile: deepseek_fast

  # Never put real API keys in this file. Each profile points to an
  # environment variable name, for example DEEPSEEK_API_KEY.
  profiles:
    deepseek_fast:
      provider: openai_compatible
      base_url: https://api.deepseek.com
      model: deepseek-chat
      api_key_env: DEEPSEEK_API_KEY
      temperature: 0.2
      max_tokens: 3000
      timeout_seconds: 60
      use_for:
        - relevance_scoring
        - topic_classification
        - draft_digest

    deepseek_reasoner:
      provider: openai_compatible
      base_url: https://api.deepseek.com
      model: deepseek-reasoner
      api_key_env: DEEPSEEK_API_KEY
      temperature: 0.1
      max_tokens: 4000
      timeout_seconds: 90
      use_for:
        - evidence_check
        - difficult_classification

    kimi_long_context:
      provider: openai_compatible
      base_url: https://api.moonshot.cn/v1
      model: kimi-k2-0711-preview
      api_key_env: MOONSHOT_API_KEY
      temperature: 0.2
      max_tokens: 4000
      timeout_seconds: 90
      use_for:
        - digest_generation
        - long_context_synthesis

    qwen_balanced:
      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
      api_key_env: DASHSCOPE_API_KEY
      temperature: 0.2
      max_tokens: 3500
      timeout_seconds: 75
      use_for:
        - digest_generation
        - chinese_rewrite

    openai_quality:
      provider: openai_compatible
      base_url: https://api.openai.com/v1
      model: gpt-5.4
      api_key_env: OPENAI_API_KEY
      temperature: 0.15
      max_tokens: 4500
      timeout_seconds: 90
      use_for:
        - final_polish
        - quality_review

  routing:
    # Fast, cheaper model for early pipeline decisions.
    relevance_scoring: deepseek_fast
    topic_classification: deepseek_fast

    # Strong Chinese synthesis model for the actual digest prose.
    digest_generation: kimi_long_context

    # Optional final pass. Set to null to skip later in code.
    final_polish: null

  digest_zh:
    enabled: true
    max_items_for_llm: 12
    output_language: zh-CN
    style: concise_research_brief
    audience: ecology_and_microbiology_researchers
    preserve_original_titles: true
    require_json: true

    output_schema:
      highlight_count: 3
      item_fields:
        - title
        - summary_zh
        - why_it_matters
        - evidence_type
        - caveat
        - source_url

    writing_rules:
      - 不夸大相关性，不把相关性写成因果。
      - 区分实验发现、模型推断、综述观点和媒体报道。
      - 保留关键研究对象、尺度、方法和限制。
      - 中文表达要凝练，不逐句翻译英文摘要。
      - 不生成无来源支撑的医学、农业或政策建议。

  embeddings:
    enabled: false
    active_profile: qwen_embedding
    profiles:
      qwen_embedding:
        provider: openai_compatible
        base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: text-embedding-v4
        api_key_env: DASHSCOPE_API_KEY
        dimensions: 1024
      local_bge_m3:
        provider: local
        model: BAAI/bge-m3
        api_key_env: null
        dimensions: 1024

  budget:
    max_items_per_run: 12
    max_retry_attempts: 2
    cache_llm_outputs: true
    cache_dir: data/cache/llm

  fallback:
    on_missing_api_key: use_rss_summary
    on_error: use_rss_summary
    save_error_details: true
    error_dir: data/cache/llm_errors
