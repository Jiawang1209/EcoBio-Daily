llm:
  enabled: true

  # Default profile used when a task does not specify its own route.
  active_profile: cstcloud_flash

  # Never put real API keys in this file. Each profile points to an
  # environment variable name, for example CSTCLOUD_API_KEY.
  # All profiles below go through the CSTCloud uni-api gateway
  # (https://uni-api.cstcloud.cn/v1), which is OpenAI-compatible.
  profiles:
    cstcloud_flash:
      provider: openai_compatible
      base_url: https://uni-api.cstcloud.cn/v1
      model: deepseek-v4-flash
      api_key_env: CSTCLOUD_API_KEY
      temperature: 0.2
      max_tokens: 1500
      timeout_seconds: 60
      use_for:
        - relevance_scoring
        - topic_classification

    cstcloud_v32:
      provider: openai_compatible
      base_url: https://uni-api.cstcloud.cn/v1
      model: deepseek-v3.2
      api_key_env: CSTCLOUD_API_KEY
      temperature: 0.2
      max_tokens: 4000
      timeout_seconds: 90
      use_for:
        - digest_generation
        - long_context_synthesis

    cstcloud_minimax:
      provider: openai_compatible
      base_url: https://uni-api.cstcloud.cn/v1
      model: minimax-m27
      api_key_env: CSTCLOUD_API_KEY
      temperature: 0.2
      max_tokens: 4000
      timeout_seconds: 90
      use_for:
        - digest_generation
        - chinese_rewrite

  routing:
    # Fast, cheaper model for early pipeline decisions.
    relevance_scoring: cstcloud_flash
    topic_classification: cstcloud_flash

    # Strong Chinese synthesis model for the actual digest prose.
    digest_generation: cstcloud_v32

    # Cheap grounding check; runs once per LLM-written item.
    grounding_check: cstcloud_flash

    # Optional final pass. Set to null to skip later in code.
    final_polish: null

  digest_zh:
    enabled: true
    max_items_for_llm: 12
    output_language: zh-CN
    style: concise_research_brief
    audience: ecology_and_microbiology_researchers
    preserve_original_titles: true
    require_json: true

    output_schema:
      highlight_count: 3
      item_fields:
        - title
        - summary_zh
        - why_it_matters
        - evidence_type
        - caveat
        - source_url

    writing_rules:
      - 不夸大相关性，不把相关性写成因果。
      - 区分实验发现、模型推断、综述观点和媒体报道。
      - 保留关键研究对象、尺度、方法和限制。
      - 中文表达要凝练，不逐句翻译英文摘要。
      - 不生成无来源支撑的医学、农业或政策建议。

  embeddings:
    enabled: false
    active_profile: cstcloud_bge_zh
    profiles:
      cstcloud_bge_zh:
        provider: openai_compatible
        base_url: https://uni-api.cstcloud.cn/v1
        model: bge-large-zh
        api_key_env: CSTCLOUD_API_KEY
        dimensions: 1024
      cstcloud_qwen3_embedding:
        provider: openai_compatible
        base_url: https://uni-api.cstcloud.cn/v1
        model: qwen3-embedding:8b
        api_key_env: CSTCLOUD_API_KEY
        dimensions: 1024

  budget:
    max_items_per_run: 24
    max_retry_attempts: 2
    cache_llm_outputs: true
    cache_dir: data/cache/llm

  fallback:
    on_missing_api_key: use_rss_summary
    on_error: use_rss_summary
    save_error_details: true
    error_dir: data/cache/llm_errors
