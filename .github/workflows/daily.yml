name: Generate EcoBio Daily

on:
  schedule:
    # 08:00 Asia/Shanghai. GitHub Actions cron uses UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Generate digest
        env:
          TZ: Asia/Shanghai
        run: python scripts/run_daily.py --date "$(date +%F)"

      - name: Commit generated files
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed "$(date +%Y)"
          git diff --cached --quiet || git commit -m "Add EcoBio daily report: $(date +%F)"
          git push
