name: Generate EcoBio Daily

on:
  schedule:
    # 08:00 Asia/Shanghai. GitHub Actions cron uses UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate LLM secret
        env:
          CSTCLOUD_API_KEY: ${{ secrets.CSTCLOUD_API_KEY }}
        run: |
          if [ -z "$CSTCLOUD_API_KEY" ]; then
            echo "CSTCLOUD_API_KEY secret is not configured. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Generate digest
        env:
          TZ: Asia/Shanghai
          CSTCLOUD_API_KEY: ${{ secrets.CSTCLOUD_API_KEY }}
        run: python scripts/run_daily.py --date "$(date +%F)" --require-llm

      - name: Validate generated digest
        env:
          TZ: Asia/Shanghai
        run: python scripts/validate_daily.py --date "$(date +%F)"

      - name: Commit generated files
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$(date +%Y)"
          git add -f data/runs data/state
          git diff --cached --quiet || git commit -m "Add EcoBio daily report: $(date +%F)"
          git push
