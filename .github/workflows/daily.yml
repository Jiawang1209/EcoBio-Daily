name: Generate EcoBio Daily

on:
  schedule:
    # 08:00 Asia/Shanghai. GitHub Actions cron uses UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      digest_date:
        description: "Digest date to generate, in YYYY-MM-DD. Leave blank for today in Asia/Shanghai."
        required: false
        type: string

concurrency:
  group: ecobio-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate LLM secret
        env:
          CSTCLOUD_API_KEY: ${{ secrets.CSTCLOUD_API_KEY }}
        run: |
          if [ -z "$CSTCLOUD_API_KEY" ]; then
            echo "CSTCLOUD_API_KEY secret is not configured. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Resolve digest date
        env:
          TZ: Asia/Shanghai
          INPUT_DIGEST_DATE: ${{ inputs.digest_date }}
        run: |
          if [ -n "$INPUT_DIGEST_DATE" ]; then
            echo "DIGEST_DATE=$INPUT_DIGEST_DATE" >> "$GITHUB_ENV"
          else
            echo "DIGEST_DATE=$(date +%F)" >> "$GITHUB_ENV"
          fi

      - name: Generate digest
        env:
          TZ: Asia/Shanghai
          CSTCLOUD_API_KEY: ${{ secrets.CSTCLOUD_API_KEY }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
        run: python scripts/run_daily.py --date "$DIGEST_DATE" --require-llm

      - name: Validate generated digest
        env:
          TZ: Asia/Shanghai
        run: python scripts/validate_daily.py --date "$DIGEST_DATE"

      - name: Write run summary
        env:
          TZ: Asia/Shanghai
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          digest_date = os.environ["DIGEST_DATE"]
          metrics = json.loads(Path(f"data/runs/{digest_date}.json").read_text())
          stages = metrics["stages"]
          build_digest = stages["build_digest"]
          llm_relevance = stages.get("llm_relevance", {})
          llm_grounding = stages["llm_grounding"]
          output = stages["output"]

          print(f"## EcoBio Daily {digest_date}")
          print()
          print("| Metric | Value |")
          print("| --- | --- |")
          print(f"| Digest items | {build_digest.get('items')} |")
          print(f"| LLM kept | {llm_relevance.get('kept', 0)} |")
          print(f"| Grounding failed | {llm_grounding.get('failed', 0)} |")
          print(f"| Grounding errored | {llm_grounding.get('errored', 0)} |")
          print(f"| Grounding repaired | {llm_grounding.get('repaired', 0)} |")
          print(f"| Chinese digest | `{output.get('zh')}` |")
          print(f"| English digest | `{output.get('en')}` |")
          PY

      - name: Commit generated files
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DIGEST_DATE:0:4}"
          git add -f data/runs data/state
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git pull --rebase --autostash origin main
            git add "${DIGEST_DATE:0:4}"
            git add -f data/runs data/state
            git diff --cached --quiet || git commit -m "Add EcoBio daily report: $DIGEST_DATE"
            git push
          fi
